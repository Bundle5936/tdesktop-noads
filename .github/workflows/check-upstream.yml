name: check

on:
  push:
    paths:
      - "patches/**"
      - "cli/**"
      - "scripts/**"
      - "versions/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "patches/**"
      - "cli/**"
      - "scripts/**"
      - "versions/**"
      - ".github/workflows/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python and patch validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile cli/*.py scripts/*.py
          python cli/tdesktop_noads.py --help
          TAG=$(python -c "import json; print(json.load(open('versions/current.json'))['tag'])")
          echo "Pinned: $TAG"
          python cli/tdesktop_noads.py check --tag "$TAG" --dry-run-only --no-keep-archive
          git diff --check
          git diff --exit-code -- patches/*.patch versions/current.json
