name: check

on:
  push:
    paths:
      - "patches/**"
      - "cli/**"
      - "versions/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "patches/**"
      - "cli/**"
      - "versions/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CLI + pin check
        run: |
          python cli/tdesktop_noads.py --help
          python cli/tdesktop_noads.py status
          TAG=$(python -c "import json; print(json.load(open('versions/current.json'))['tag'])")
          echo "Pinned: $TAG"
          python cli/tdesktop_noads.py check --tag "$TAG" --dry-run-only --no-keep-archive
