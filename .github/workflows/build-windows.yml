name: build-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag (empty = versions/current.json)"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Upstream tag"
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "versions/current.json"
      - "patches/**"
      - "scripts/**"
      - "cli/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: build-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  PREPARE_PATH: Telegram/build/prepare/prepare.py
  CACHE_EPOCH: v4
  TOOLSET: "14.44"

jobs:
  windows-release:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      BUILD_TARGET: win64
      MSVC_ARCH: x64
      LIBS_SUBDIR: \win64
      MODULES_ARCH: x64
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free runner disk space
        shell: pwsh
        run: |
          $targets = @(
            'C:\Android',
            'C:\Miniconda',
            'C:\Julia',
            'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\Amazon',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Microsoft SQL Server',
            'C:\Program Files\R',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\node',
            'C:\tools\kotlinc',
            'C:\SeleniumWebDrivers'
          )
          foreach ($target in $targets) {
            if (Test-Path $target) {
              Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
              Write-Host "removed $target"
            }
          }
          Get-PSDrive C,D -ErrorAction SilentlyContinue | Format-Table Name,Free

      - name: Prepare directories
        run: |
          if exist D:\ (
            if not exist D:\TBuild\Libraries mkdir D:\TBuild\Libraries
            mklink /d %GITHUB_WORKSPACE%\TBuild D:\TBuild
          ) else (
            if not exist %userprofile%\TBuild\Libraries mkdir %userprofile%\TBuild\Libraries
            mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          )
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries%LIBS_SUBDIR%>>%GITHUB_ENV%
          echo REPO_NAME=tdesktop>>%GITHUB_ENV%

      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: noads
          ref: main
          fetch-depth: 0

      - name: Resolve and validate tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag || github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [[ -z "$TAG" ]]; then
            TAG=$(python -c "import json; print(json.load(open('noads/versions/current.json'))['tag'])")
          fi
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}([.-][A-Za-z0-9._-]+)?$ ]] || {
            echo "Invalid tag: $TAG" >&2
            exit 1
          }
          PINNED=$(python -c "import json; print(json.load(open('noads/versions/current.json'))['tag'])")
          [[ "$TAG" == "$PINNED" ]] || {
            echo "Requested tag $TAG does not match committed pin $PINNED" >&2
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream tdesktop
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ steps.meta.outputs.tag }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Apply committed patches
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/noads/scripts/apply_patches.py" \
            --src "$TBUILD/tdesktop" \
            --patches-dir "$GITHUB_WORKSPACE/noads/patches" \
            --cli "$GITHUB_WORKSPACE/noads/cli/tdesktop_noads.py"
          test -f "$TBUILD/tdesktop/Telegram/SourceFiles/settings/settings_noads.cpp"
          test -f "$TBUILD/tdesktop/Telegram/SourceFiles/lang/translate_llm_provider.cpp"
          test -f "$TBUILD/tdesktop/Telegram/SourceFiles/api/api_custom_transcribe.cpp"
          grep -q 'OptionNoadsDisableAds' "$TBUILD/tdesktop/Telegram/SourceFiles/data/components/sponsored_messages.cpp"
          grep -q 'OptionNoadsLocalPremium' "$TBUILD/tdesktop/Telegram/SourceFiles/main/main_session.cpp"
          grep -q 'CreateLlmTranslateProvider' "$TBUILD/tdesktop/Telegram/SourceFiles/lang/translate_provider.cpp"
          grep -q 'TryCustomTranscribe' "$TBUILD/tdesktop/Telegram/SourceFiles/api/api_transcribes.cpp"

      - name: Read SDK and compute cache keys
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          DOCPATH="$TBUILD/tdesktop/docs/building-win.md"
          SDK=$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')
          PATCH_KEY=$(sha256sum noads/patches/*.patch | sha256sum | awk '{print $1}')
          {
            echo "$CACHE_EPOCH"
            echo "${{ runner.os }}-${{ runner.arch }}-x64"
            echo "$TOOLSET"
            echo "$SDK"
            echo "${{ steps.meta.outputs.tag }}"
            sha256sum "$TBUILD/tdesktop/$PREPARE_PATH"
          } > CACHE_KEY.txt
          CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{print $1}')
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_ENV"
          echo "PATCH_KEY=$PATCH_KEY" >> "$GITHUB_ENV"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "patch_key=$PATCH_KEY" >> "$GITHUB_OUTPUT"

          echo "SDK=$SDK"
          echo "cache key=$CACHE_KEY"
          echo "patch key=$PATCH_KEY"

      - name: Match upstream MSVC debug flags
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - name: Native Tools Command Prompt
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: ${{ env.MSVC_ARCH }}
          sdk: ${{ env.SDK }}
          toolset: ${{ env.TOOLSET }}

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Make ATL available
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio: $vs"

          function Find-AtlRoot {
            if ($env:VCToolsInstallDir) {
              $preferred = Join-Path $env:VCToolsInstallDir 'atlmfc'
              if (Test-Path (Join-Path $preferred 'include\atlbase.h')) { return $preferred }
            }
            $found = Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) { return (Split-Path (Split-Path $found.FullName -Parent) -Parent) }
            return $null
          }

          $atlRoot = Find-AtlRoot
          if (-not $atlRoot) {
            Write-Host 'ATL is not installed, adding the component.'
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
              'modify', '--installPath', "`"$vs`"", `
              '--add', 'Microsoft.VisualStudio.Component.VC.ATL', `
              '--quiet', '--norestart', '--nocache'
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Write-Error "vs_installer failed with $($p.ExitCode)"; exit 1
            }
            $atlRoot = Find-AtlRoot
          }
          if (-not $atlRoot) { Write-Error 'atlbase.h still not found'; exit 1 }

          $legacy = Join-Path $vs 'VC\atlmfc'
          $toolset = Join-Path $env:VCToolsInstallDir 'atlmfc'
          foreach ($link in @($legacy, $toolset)) {
            if (-not (Test-Path $link)) {
              New-Item -ItemType Junction -Path $link -Target $atlRoot | Out-Null
            }
          }
          foreach ($probe in @(
            (Join-Path $legacy 'include\atlbase.h'),
            (Join-Path $legacy 'include\atlcomcli.h'),
            (Join-Path $toolset 'lib\x64\atls.lib'))) {
            if (-not (Test-Path $probe)) { Write-Error "unreachable: $probe"; exit 1 }
            Write-Host "found $probe"
          }

      - name: ThirdParty cache restore
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-third-party-

      - name: Libraries cache restore
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-x64-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-x64-libs-rel-

      - name: Qt cache restore
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-x64-qt-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-x64-qt-rel-

      - name: Build Release libraries
        timeout-minutes: 285
        run: '%TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent'

      - name: Free library build leftovers
        if: always()
        shell: bash
        run: |
          [ -d "$LibrariesPath" ] || exit 0
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/qt6windows7/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Save ThirdParty cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Save libraries cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-x64-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Save Qt cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-x64-qt-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Build Telegram Desktop Release
        env:
          _CL_: /MP2
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          set "CFG_FLAGS=tag=${{ steps.meta.outputs.tag }} patch=${{ steps.setup.outputs.patch_key }} api=%TDESKTOP_API_ID% win7=on"
          set "CFG_MARKER=..\out\.ci_configure_flags"
          set "REUSE_TREE=0"
          if exist ..\out\CMakeCache.txt if exist "%CFG_MARKER%" (
            for /f "usebackq delims=" %%a in ("%CFG_MARKER%") do (
              if "%%a"=="%CFG_FLAGS%" set "REUSE_TREE=1"
            )
          )
          if "%REUSE_TREE%"=="1" (
            echo Reusing the configured build tree.
            goto :build
          )
          echo Configuring the Release build tree.
          if "%TDESKTOP_API_ID%"=="" (
            call configure.bat ^
              -D TDESKTOP_API_TEST=ON ^
              -D CMAKE_CONFIGURATION_TYPES=Release ^
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
              -D DESKTOP_APP_WIN7_COMPAT=ON ^
              -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
              || exit /b 1
          ) else (
            call configure.bat ^
              -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
              -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
              -D CMAKE_CONFIGURATION_TYPES=Release ^
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
              -D DESKTOP_APP_WIN7_COMPAT=ON ^
              -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
              || exit /b 1
          )
          > "%CFG_MARKER%" echo %CFG_FLAGS%
          :build
          cmake --build ..\out --config Release --target Telegram --parallel 2 || exit /b 1

      - name: Package portable zip
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.ver }}"
          OUT="$TBUILD/tdesktop/out/Release"
          STAGE="$GITHUB_WORKSPACE/portable-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          test -f "$OUT/Telegram.exe"
          cp "$OUT/Telegram.exe" "$STAGE/"
          [[ -f "$OUT/Updater.exe" ]] && cp "$OUT/Updater.exe" "$STAGE/" || true
          for f in modules CrashReports; do [[ -e "$OUT/$f" ]] && cp -a "$OUT/$f" "$STAGE/" || true; done
          find "$OUT" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.pak' -o -name '*.dat' \) -exec cp {} "$STAGE/" \;
          : > "$STAGE/portable"
          cat > "$STAGE/README-noads.txt" <<EOF
          tdesktop-noads portable Windows x64
          Upstream: ${{ steps.meta.outputs.tag }}
          Features: no sponsored messages, local Premium UI, OpenAI-compatible translation and STT.
          localPremium does not unlock server-verified Premium features.
          EOF
          ZIP="tportable-x64-noads-${VER}.zip"
          powershell -NoProfile -Command "Compress-Archive -Path '$STAGE\\*' -DestinationPath '$GITHUB_WORKSPACE\\$ZIP' -Force"
          sha256sum "$GITHUB_WORKSPACE/$ZIP" > "$GITHUB_WORKSPACE/$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_path=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha_path=$GITHUB_WORKSPACE/$ZIP.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tportable-x64-noads-${{ steps.meta.outputs.ver }}
          path: |
            ${{ steps.pack.outputs.zip_path }}
            ${{ steps.pack.outputs.sha_path }}
          if-no-files-found: error

      - name: Attach files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.pack.outputs.zip_path }}
            ${{ steps.pack.outputs.sha_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows x64 Release"
            echo "- tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- zip: \`${{ steps.pack.outputs.zip }}\`"
            echo "- job: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
