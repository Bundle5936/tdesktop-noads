name: build-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag (empty = versions/current.json)"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Upstream tag"
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "patches/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: build-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      CACHE_EPOCH: v2
      TOOLSET: "14.44"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: noads
          ref: main
          fetch-depth: 0

      - name: Resolve and validate tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag || github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [[ -z "$TAG" ]]; then
            TAG=$(python -c "import json; print(json.load(open('noads/versions/current.json'))['tag'])")
          fi
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
          PINNED=$(python -c "import json; print(json.load(open('noads/versions/current.json'))['tag'])")
          if [[ "$TAG" != "$PINNED" ]]; then
            echo "Requested tag $TAG does not match committed pin $PINNED" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve API mode
        id: api
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TDESKTOP_API_ID:-}" && -n "${TDESKTOP_API_HASH:-}" ]]; then
            echo "source=secrets" >> "$GITHUB_OUTPUT"
            echo "test=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TDESKTOP_API_ID/HASH not set; using upstream test mode."
            echo "source=test" >> "$GITHUB_OUTPUT"
            echo "test=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare directories
        run: |
          if not exist %userprofile%\TBuild\Libraries mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone official tdesktop at tag
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ steps.meta.outputs.tag }}
          submodules: recursive
          path: ${{ env.TBUILD }}/tdesktop

      - name: Apply committed patches exactly
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/noads/scripts/apply_patches.py" \
            --src "$TBUILD/tdesktop" \
            --patches-dir "$GITHUB_WORKSPACE/noads/patches" \
            --cli "$GITHUB_WORKSPACE/noads/cli/tdesktop_noads.py"
          test -f "$TBUILD/tdesktop/Telegram/SourceFiles/settings/settings_noads.cpp"
          test -f "$TBUILD/tdesktop/Telegram/SourceFiles/lang/translate_llm_provider.cpp"
          test -f "$TBUILD/tdesktop/Telegram/SourceFiles/api/api_custom_transcribe.cpp"
          grep -q 'OptionNoadsDisableAds' "$TBUILD/tdesktop/Telegram/SourceFiles/data/components/sponsored_messages.cpp"
          grep -q 'OptionNoadsLocalPremium' "$TBUILD/tdesktop/Telegram/SourceFiles/main/main_session.cpp"
          grep -q 'CreateLlmTranslateProvider' "$TBUILD/tdesktop/Telegram/SourceFiles/lang/translate_provider.cpp"
          grep -q 'TryCustomTranscribe' "$TBUILD/tdesktop/Telegram/SourceFiles/api/api_transcribes.cpp"

      - name: Read SDK and compute cache key
        shell: bash
        run: |
          set -euo pipefail
          DOCPATH="$TBUILD/tdesktop/docs/building-win.md"
          SDK=$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          {
            echo "$CACHE_EPOCH"
            echo "${{ runner.os }}-${{ runner.arch }}-x64"
            echo "$TOOLSET"
            echo "$SDK"
            echo "${{ steps.meta.outputs.tag }}"
            sha256sum "$TBUILD/tdesktop/$PREPARE_PATH"
            sha256sum "$GITHUB_WORKSPACE/noads/.github/workflows/build-windows.yml"
          } > CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Match upstream MSVC debug flags
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - name: Native Tools Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: ${{ env.TOOLSET }}

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Libraries cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-x64-libs-${{ env.CACHE_KEY }}

      - name: Qt cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-x64-qt-${{ env.CACHE_KEY }}

      - name: Skip breakpad dump_syms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["TBUILD"]) / "tdesktop/Telegram/build/prepare/prepare.py"
          text = p.read_text(encoding="utf-8")
          old = (
              "    cd tools\\windows\\dump_syms\n"
              "    gyp dump_syms.gyp --format=msvs\n"
              "    msbuild -m dump_syms.vcxproj /property:Configuration=Release /property:Platform=\"x64\" %ToolsetProp%"
          )
          new = "    rem tdesktop-noads: skip dump_syms (crash reports disabled)\n    echo skip dump_syms"
          if old not in text:
              raise SystemExit("breakpad dump_syms block not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      # Release needs tg_angle.lib and avif.lib; do not use upstream's Debug-only skip-release mode.
      - name: Prepare Release libraries
        run: '%TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent'

      - name: Free disk space
        shell: bash
        run: |
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Configure and build Release
        shell: cmd
        run: |
          cd %TBUILD%\tdesktop\Telegram
          if "${{ steps.api.outputs.test }}"=="true" (
            call configure.bat x64 ^
              -D TDESKTOP_API_TEST=ON ^
              -D CMAKE_CONFIGURATION_TYPES=Release ^
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          ) else (
            call configure.bat x64 ^
              -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
              -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
              -D CMAKE_CONFIGURATION_TYPES=Release ^
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          )
          if errorlevel 1 exit /b 1
          if not exist ..\out\ALL_BUILD.vcxproj exit /b 1
          cmake --build ..\out --config Release --parallel

      - name: Package portable zip
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.ver }}"
          OUT="$TBUILD/tdesktop/out/Release"
          STAGE="$GITHUB_WORKSPACE/portable-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          test -f "$OUT/Telegram.exe"
          cp "$OUT/Telegram.exe" "$STAGE/"
          [[ -f "$OUT/Updater.exe" ]] && cp "$OUT/Updater.exe" "$STAGE/" || true
          for f in modules CrashReports; do [[ -e "$OUT/$f" ]] && cp -a "$OUT/$f" "$STAGE/" || true; done
          find "$OUT" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.pak' -o -name '*.dat' \) -exec cp {} "$STAGE/" \;
          : > "$STAGE/portable"
          cat > "$STAGE/README-noads.txt" <<EOF
          tdesktop-noads portable Windows x64
          Upstream: ${{ steps.meta.outputs.tag }}
          Features: no sponsored messages, local Premium UI, OpenAI-compatible translation and STT.
          localPremium does not unlock server-verified Premium features.
          EOF
          ZIP="tportable-x64-noads-${VER}.zip"
          powershell -NoProfile -Command "Compress-Archive -Path '$STAGE\\*' -DestinationPath '$GITHUB_WORKSPACE\\$ZIP' -Force"
          sha256sum "$GITHUB_WORKSPACE/$ZIP" > "$GITHUB_WORKSPACE/$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_path=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha_path=$GITHUB_WORKSPACE/$ZIP.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tportable-x64-noads-${{ steps.meta.outputs.ver }}
          path: |
            ${{ steps.pack.outputs.zip_path }}
            ${{ steps.pack.outputs.sha_path }}
          if-no-files-found: error

      - name: Attach files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.pack.outputs.zip_path }}
            ${{ steps.pack.outputs.sha_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows portable build"
            echo "- tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- zip: \`${{ steps.pack.outputs.zip }}\`"
            echo "- API mode: \`${{ steps.api.outputs.source }}\`"
            echo "- job: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
