name: auto-follow

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag (empty = latest)"
        required: false
        default: ""
      force:
        description: "Re-check even if already pinned"
        type: boolean
        required: false
        default: false
      build_windows:
        description: "For manual runs, also dispatch the Windows build"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: auto-follow
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Follow upstream and auto-heal
        id: follow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(follow --auto-heal --dry-run-only --no-keep-archive)
          if [[ -n "$INPUT_TAG" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^v?[0-9]+(\.[0-9]+){2,3}([.-][A-Za-z0-9._-]+)?$ ]]; then
              echo "Invalid tag: $INPUT_TAG" >&2
              exit 1
            fi
            ARGS+=(--tag "$INPUT_TAG")
          fi
          [[ "$INPUT_FORCE" == "true" ]] && ARGS+=(--force)
          set +e
          python cli/tdesktop_noads.py "${ARGS[@]}"
          CODE=$?
          set -e
          echo "follow_exit=$CODE" >> "$GITHUB_OUTPUT"
          grep -q '^tag=' "$GITHUB_OUTPUT" 2>/dev/null || echo "tag=" >> "$GITHUB_OUTPUT"
          if [[ "$CODE" -eq 2 ]]; then
            echo "patch_ok=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "healed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$CODE"

      - name: Commit pin and patches
        id: commit
        if: steps.follow.outputs.changed == 'true' && steps.follow.outputs.patch_ok == 'true'
        shell: bash
        env:
          TAG: ${{ steps.follow.outputs.tag }}
          HEALED: ${{ steps.follow.outputs.healed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/current.json patches/*.patch
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="chore: follow upstream ${TAG}"
          [[ "$HEALED" == "true" ]] && MSG="$MSG (auto-healed patches)"
          git commit -m "$MSG"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or verify release tag
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        env:
          TAG: ${{ steps.follow.outputs.tag }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          REMOTE_TAG=$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')
          if [[ -n "$REMOTE_TAG" ]]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            EXISTING=$(git rev-list -n 1 "$TAG")
            if [[ "$EXISTING" != "$TARGET_SHA" ]]; then
              echo "Tag $TAG already points to $EXISTING, not $TARGET_SHA" >&2
              echo "Use a new project revision tag for same-version patch rebuilds." >&2
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Tracked upstream $TAG; patches verified"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create source release
        if: steps.commit.outputs.committed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.follow.outputs.tag }}
          name: ${{ steps.follow.outputs.tag }} (patches verified)
          body_path: work/release-notes.md
          files: |
            patches/*.patch
            versions/current.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch Windows build for every tracked upstream release
        # Scheduled/repository-dispatch runs build automatically; manual runs
        # retain the build_windows switch so a check-only run stays cheap.
        if: steps.commit.outputs.committed == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_windows == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.follow.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Dispatching Windows build for $TAG"
          gh workflow run build-windows.yml --ref main \
            -f tag="$TAG"

      - name: Open issue if auto-heal failed
        if: steps.follow.outputs.patch_ok == 'false'
        uses: actions/github-script@v7
        env:
          FAILED_TAG: ${{ steps.follow.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.FAILED_TAG;
            let details = '(no follow-failure.json)';
            try { details = fs.readFileSync('work/follow-failure.json', 'utf8'); } catch (_) {}
            const title = `Auto-follow failed on upstream ${tag}`;
            const body = `## Auto-follow and auto-heal failed\n\n\`\`\`json\n${details}\n\`\`\``;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
            core.setFailed(`Could not track upstream ${tag}`);

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## auto-follow"
            echo "- tag: \`${{ steps.follow.outputs.tag }}\`"
            echo "- changed: ${{ steps.follow.outputs.changed }}"
            echo "- patch OK: ${{ steps.follow.outputs.patch_ok }}"
            echo "- healed: ${{ steps.follow.outputs.healed }}"
            echo "- committed: ${{ steps.commit.outputs.committed }}"
            echo "- job: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
